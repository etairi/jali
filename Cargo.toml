[package]
name = "jali"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Lattice-based zero-knowledge proofs in Rust: the LNP22 proof system (ePrint 2022/284)"
repository = "https://github.com/etairi/jali"
documentation = "https://docs.rs/jali"
readme = "README.md"
keywords = ["zero-knowledge", "lattice", "post-quantum", "zk", "pqc"]
categories = ["cryptography", "mathematics"]
# The Python tools under tools/ stay in the repository; the test that runs against them, and the
# requests and reports that only it reads, are left out with them.
include = [
    "/src",
    "/tests",
    "!/tests/params_crosscheck.rs",
    "!/tests/fixtures/params/*.request.json",
    "!/tests/fixtures/params/*.report.json",
    "/examples",
    "/benches",
    "/kat/primitives.json",
    "/docs/katex-header.html",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[dependencies]
aes = { version = "0.9", features = ["zeroize"] }
ctr = { version = "0.10", features = ["zeroize"] }
shake = { version = "0.1", features = ["zeroize"] }
crypto-bigint = { version = "0.7", features = ["zeroize"] }
crypto-primes = { version = "0.7", default-features = false }
zeroize = { version = "1.9", features = ["derive"] }
rand_core = "0.10"
thiserror = "2"
serde = { version = "1.0.185", features = ["derive"], optional = true }
serde_json = { version = "1.0.100", optional = true }
rayon = { version = "1.3", optional = true }

[dev-dependencies]
hex = "0.4"
num-bigint = "0.4.4"
num-traits = "0.2.19"
proptest = "1.11"
serde_json = "1.0.100"
criterion = "0.8"
# A format that does not describe itself, for the binary serde forms.
postcard = { version = "1.1", default-features = false, features = ["alloc"] }

[features]
default = []
serde = ["dep:serde", "dep:serde_json"]
test-utils = []
parallel = ["dep:rayon"]

[[bench]]
name = "arithmetic"
harness = false

[[bench]]
name = "protocols"
harness = false

[[example]]
name = "possession"
required-features = ["serde"]

[package.metadata.docs.rs]
features = ["serde"]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--html-in-header", "docs/katex-header.html"]

[profile.test]
opt-level = 3

# `crypto_bigint::cpubits!` selects code by limb width through `cfg(cpubits)`, which can also be
# set by hand: RUSTFLAGS='--cfg cpubits="32"' runs the 32-bit limb code on a 64-bit host.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(cpubits, values("16", "32", "64"))'] }
