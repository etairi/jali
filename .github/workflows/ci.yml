name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  RAYON_NUM_THREADS: 2
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        toolchain: ['1.95.0', stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --locked --all-features
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --release --all-features
  limbs32:
    # The suite with crypto-bigint's 32-bit limbs on a 64-bit host: no target of the test job
    # has 32-bit limbs.
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: '--cfg cpubits="32"'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --release --all-features
  cross:
    # The library for i686 (32-bit limbs and usize) and wasm32 (64-bit limbs). A check only:
    # the tests' Criterion dependency needs a C compiler for the target.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu, wasm32-unknown-unknown
      - run: cargo check --locked --target i686-unknown-linux-gnu --all-features
      - run: cargo check --locked --target wasm32-unknown-unknown --no-default-features
      - run: cargo check --locked --target wasm32-unknown-unknown --all-features
  package:
    # The published package builds, and its tests compile from the files it contains.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo package --locked
          cd target/package/jali-*/
          cargo test --locked --all-features --no-run
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
  tools:
    # The Python tools regenerate the checked-in parameter sets, test fixtures, known-answer
    # vectors, base Gaussian table and NTT primes exactly; the parameter tool's own tests follow
    # (their SageMath oracles skip here). Last, a verifier built against this crate checks that
    # the Rust checks still decide the recorded cases as the tool's reference data say. The
    # runner image and the Rust toolchain are pinned, the toolchain to the rustc that recorded
    # tools/params/tests/data, so that a new image or compiler shows up as a change here rather
    # than as a failure of this job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - name: Parameter sets
        run: |
          out=$(mktemp -d)
          t=tools/params
          derive() { python $t/lnp_params.py "$1" "$2" --output "$3"; }
          python $t/lnp_params.py regenerate --check
          # The toy set and the possession fixture take the tool's MLWE report for their ring.
          python $t/lnp_params.py rank --degree 64 --q 1099511627917 --mlwe-report \
            > "$out/toy-d64.report.json"
          diff -u $t/toy-d64.report.json "$out/toy-d64.report.json"
          derive $t/toy-d64.request.json $t/toy-d64.report.json "$out/toy-d64.json"
          diff -u src/params/sets/toy-d64.json "$out/toy-d64.json"
          derive $t/possession.request.json $t/toy-d64.report.json "$out/possession.json"
          diff -u examples/fixtures/possession.json "$out/possession.json"
          # A fixture without an output is a request that the tool must refuse.
          for report in tests/fixtures/params/*.report.json; do
            f=${report%.report.json}
            n=${f##*/}
            if [ -f "$f.json" ]; then
              derive "$f.request.json" "$report" "$out/$n.json"
              diff -u "$f.json" "$out/$n.json"
            elif derive "$f.request.json" "$report" "$out/$n.json" 2> "$out/$n.err"; then
              echo "$n: the tool accepted a request that it must refuse" >&2
              exit 1
            else
              grep -q 'no suitable divisor' "$out/$n.err"
            fi
          done
      - name: Known-answer vectors, base Gaussian table and NTT primes
        run: |
          out=$(mktemp -d)
          python tools/kat/half_gaussian_cdf.py --check
          python tools/kat/generate.py --output "$out/primitives.json"
          diff -u kat/primitives.json "$out/primitives.json"
          # As many primes as the Rust table has; the default --count 4 is its prefix.
          n=$(grep -c '^    ([0-9]*, [0-9]*),$' src/params/moduli.rs)
          python tools/params/moduli.py --count "$n" > "$out/moduli.json"
          python - "$out/moduli.json" <<'EOF'
          import json, re, sys
          table = open("src/params/moduli.rs").read()
          rust = [[int(a), int(b)] for a, b in re.findall(r"\((\d+), (\d+)\)", table)]
          sys.exit(rust != json.load(open(sys.argv[1])))
          EOF
      - name: Parameter tool tests
        run: python -m unittest discover -s tools/params/tests -v
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - name: Rust reference data of the parameter tool
        # Builds the verifier of tools/params/rust_reference.py in a copy of the crate, with
        # its own target directory, and compares Rust's decisions, the tool's sets for the
        # statement kinds and the seeded proofs with tools/params/tests/data (f64 outputs
        # within 4 ULP across platforms).
        run: python tools/params/rust_reference.py --check
